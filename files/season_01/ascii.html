<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NX ASCII MATRIX • WEBCAM • ORGANIC FLAME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #ascii-canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; image-rendering: crisp-edges; image-rendering: pixelated; background: #000; }
        .hotspot-trigger { position: fixed; top: 0; right: 0; width: 30%; height: 100%; z-index: 50; background: transparent; cursor: pointer; pointer-events: auto; }
        .hard-console { position: fixed; bottom: 24px; left: 24px; right: 24px; background: rgba(0,0,0,0.88); backdrop-filter: blur(24px); border: none; border-top: 2px solid #00ff41; border-bottom: 2px solid #00ff41; padding: 20px 24px; z-index: 200; transition: transform 0.3s, opacity 0.2s; font-family: 'Courier New', monospace; pointer-events: auto; max-height: 60vh; overflow-y: auto; box-shadow: 0 0 40px rgba(0,255,65,0.15), inset 0 0 20px rgba(0,255,65,0.05); }
        .panel-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: flex-start; }
        .cyber-card { background: rgba(0,0,0,0.75); border-left: 3px solid #00ff41; border-right: 1px solid rgba(0,255,65,0.3); padding: 14px 16px; min-width: 180px; flex: 1 1 auto; backdrop-filter: blur(4px); }
        .cyber-card h4 { font-size: 11px; letter-spacing: 2px; font-weight: 700; color: #00ff41; text-transform: uppercase; margin: 0 0 14px 0; border-bottom: 1.5px solid #00ff41; display: inline-block; font-family: 'Courier New', monospace; text-shadow: 0 0 4px #00ff41; padding-bottom: 4px; }
        .ctrl-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        label { font-size: 9px; font-weight: bold; color: #88ff88; font-family: 'Courier New', monospace; letter-spacing: 1px; min-width: 70px; text-transform: uppercase; }
        input[type="range"] { flex: 1; height: 3px; -webkit-appearance: none; background: #1a1a1a; border-radius: 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #00ff41; border-radius: 0; cursor: pointer; box-shadow: 0 0 8px #00ff41; border: none; }
        button { background: transparent; border: 1.5px solid #00ff41; color: #00ff41; font-family: 'Courier New', monospace; font-size: 9px; font-weight: bold; padding: 6px 14px; cursor: pointer; transition: 0.08s linear; text-transform: uppercase; letter-spacing: 1px; }
        button:active { background: #00ff41; color: #000; transform: scale(0.96); box-shadow: 0 0 12px #00ff41; }
        select { background: #050505; border: 1.5px solid #00ff41; color: #00ff41; font-family: 'Courier New', monospace; font-size: 9px; font-weight: bold; padding: 6px 10px; border-radius: 0; cursor: pointer; text-transform: uppercase; }
        .status-led { font-size: 8px; background: #000; padding: 4px 10px; border: 1px solid #00ff41; font-weight: bold; color: #00ff41; display: inline-block; text-transform: uppercase; letter-spacing: 1px; }
        .ui-hidden .hard-console { opacity: 0; transform: translateY(60px); pointer-events: none; }
        .toast-msg { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, -40%); background: #000000ee; border: 2px solid #00ff41; padding: 10px 22px; font-family: 'Courier New', monospace; font-weight: bold; color: #00ff41; z-index: 400; border-radius: 0; animation: fadeOut 0.8s forwards; pointer-events: none; font-size: 12px; white-space: nowrap; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 0 20px rgba(0,255,65,0.3); }
        @keyframes fadeOut { 0% { opacity: 0; transform: translate(-50%, -40%) scale(0.95);} 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1.05);} }
        @media (max-width: 900px) { .hard-console { padding: 14px 16px; left: 12px; right: 12px; bottom: 12px; max-height: 58vh;} .cyber-card { padding: 10px 12px; min-width: 145px;} button { padding: 5px 10px; font-size: 8px;} label { font-size: 8px; min-width: 60px;} .hotspot-trigger { width: 35%; } }
    </style>
</head>
<body>
    <canvas id="ascii-canvas"></canvas>
    <div class="hotspot-trigger" id="hotspotTrigger"></div>
    <div class="hard-console" id="hardConsole">
        <div class="panel-grid">
            <div class="cyber-card"><h4>🔥 ORGANIC FLAME</h4><div class="ctrl-row"><label>FLAME INTENSE</label><input type="range" id="flameIntensity" min="0" max="2.0" step="0.01" value="1.0"></div><div class="ctrl-row"><label>NOISE DEFORM</label><input type="range" id="noiseDeform" min="0" max="1.5" step="0.01" value="0.6"></div><div class="ctrl-row"><label>FLOW SPEED</label><input type="range" id="deformSpeed" min="0" max="2.0" step="0.02" value="1.0"></div><div class="ctrl-row"><label>ROT X</label><input type="range" id="rotX" min="-1.5" max="1.5" step="0.01" value="0.3"></div><div class="ctrl-row"><label>ROT Y</label><input type="range" id="rotY" min="-1.5" max="1.5" step="0.01" value="0.5"></div><div class="ctrl-row"><label>ZOOM</label><input type="range" id="zoom" min="3" max="9" step="0.1" value="5.5"></div></div>
            <div class="cyber-card"><h4>🎨 ASCII + CHROMA</h4><div class="ctrl-row"><label>DENSITY</label><input type="range" id="charDensity" min="0.3" max="1.8" step="0.01" value="1.0"></div><div class="ctrl-row"><label>CHARSET</label><select id="charSetSelect"><option value="matrix">MATRIX</option><option value="dense">DENSE</option><option value="binary">BINARY</option><option value="full" selected>FULL</option></select></div><div class="ctrl-row"><label>HUE</label><input type="range" id="masterHue" min="0" max="360" step="1" value="180"></div><div class="ctrl-row"><label>SATURATION</label><input type="range" id="masterSat" min="0" max="2.0" step="0.01" value="1.4"></div><div class="ctrl-row"><label>BRIGHT</label><input type="range" id="masterLight" min="0.3" max="2.0" step="0.02" value="1.0"></div><div class="ctrl-row"><button id="monoBtn">MONO</button><button id="coloramaBtn">COLORAMA</button></div></div>
            <div class="cyber-card"><h4>🌀 WARP + GLITCH</h4><div class="ctrl-row"><label>WARP INTENSE</label><input type="range" id="warpIntensity" min="0" max="1.5" step="0.01" value="0.5"></div><div class="ctrl-row"><label>RGB SPLIT</label><input type="range" id="rgbSplit" min="0" max="0.08" step="0.0005" value="0.015"></div><div class="ctrl-row"><label>SCANLINES</label><input type="range" id="scanLines" min="0" max="1.2" step="0.01" value="0.5"></div><div class="ctrl-row"><button id="glitchBurstBtn">GLITCH BURST</button></div></div>
            <div class="cyber-card"><h4>🎛️ SMOOTH REACT</h4><div class="ctrl-row"><button id="audioMicBtn">MIC</button><select id="audioBand"><option value="0">BASS</option><option value="1">MID</option><option value="2">HIGH</option></select></div><div class="ctrl-row"><label>REACT SENS</label><input type="range" id="audioAmp" min="0" max="2.2" step="0.02" value="1.3"></div><div class="ctrl-row"><label>SMOOTH</label><input type="range" id="smoothFactor" min="0.1" max="0.95" step="0.01" value="0.75"></div><div class="status-led" id="audioStatus">OFF</div></div>
            <div class="cyber-card"><h4>📹 WEBCAM ASCII</h4><div class="ctrl-row"><button id="webcamBtn">📷 WEBCAM ON/OFF</button></div><div class="ctrl-row"><label>WEBCAM MIX</label><input type="range" id="webcamMix" min="0" max="1.0" step="0.01" value="0.5"></div><div class="status-led" id="webcamStatus">OFF</div></div>
            <div class="cyber-card"><h4>📀 CAPTURE</h4><div class="ctrl-row"><button id="pngBtn">PNG</button><button id="recordBtn">REC</button><button id="stopBtn">STOP</button></div><div class="ctrl-row"><button id="hideUiBtn">HIDE UI</button><button id="resetBtn">RESET</button></div></div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        
        // ============================================
        // SISTEMA DE VALIDACIÓN NX PRO
        // ============================================
        let __NX_TOKEN__ = null;
        let __NX_BLOQUEO_ACTIVO__ = false;
        let __NX_ANIMATION_ID__ = null;
        
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromURL = urlParams.get('token');
        const tokenFromWindow = window.__NX_TOKEN__;
        __NX_TOKEN__ = tokenFromURL || tokenFromWindow || null;
        
        function mostrarBloqueo(mensaje) {
            if (__NX_BLOQUEO_ACTIVO__) return;
            __NX_BLOQUEO_ACTIVO__ = true;
            
            if (__NX_ANIMATION_ID__) {
                cancelAnimationFrame(__NX_ANIMATION_ID__);
                __NX_ANIMATION_ID__ = null;
            }
            
            const blocker = document.createElement('div');
            blocker.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:99999;display:flex;justify-content:center;align-items:center;font-family:monospace;text-align:center;backdrop-filter:blur(10px);';
            blocker.innerHTML = `<div style="background:#1a1a1a;padding:40px;border:3px solid #ff4444;max-width:500px;"><h1 style="color:#ff4444;">⛔ ACCESO DENEGADO</h1><h2 style="color:white;">${mensaje}</h2><div style="margin-top:30px;"><a href="https://www.najarrox.xyz" style="background:#8b5cf6;color:black;padding:12px 24px;text-decoration:none;font-weight:bold;">🛒 COMPRAR AHORA</a><a href="/demo/kaleido" style="background:transparent;color:#8b5cf6;padding:12px 24px;text-decoration:none;margin-left:10px;border:1px solid #8b5cf6;">🎬 PROBAR DEMO</a></div></div>`;
            document.body.appendChild(blocker);
        }
        
        if (!__NX_TOKEN__) {
            let tiempoRestante = 120;
            let overlayCreado = false;
            
            const contador = document.createElement('div');
            contador.style.cssText = 'position:fixed;bottom:20px;right:20px;background:rgba(0,0,0,0.8);color:#ffaa44;font-family:monospace;padding:8px 16px;z-index:10000;font-size:14px;font-weight:bold;border-right:3px solid #ffaa44;pointer-events:none;';
            contador.innerHTML = `⏱️ DEMO: 2:00`;
            document.body.appendChild(contador);
            
            const intervaloDemo = setInterval(() => {
                if (__NX_BLOQUEO_ACTIVO__) return;
                tiempoRestante--;
                const mins = Math.floor(tiempoRestante / 60);
                const segs = (tiempoRestante % 60).toString().padStart(2, '0');
                contador.innerHTML = `⏱️ DEMO: ${mins}:${segs}`;
                
                if (tiempoRestante <= 30 && !overlayCreado) {
                    overlayCreado = true;
                    const warning = document.createElement('div');
                    warning.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#ff6600;font-family:monospace;padding:10px 20px;z-index:10000;font-size:14px;border:2px solid #ff6600;animation:pulse 1s infinite;';
                    warning.innerHTML = '⚠️ DEMO TERMINA EN 30 SEGUNDOS - Compra en najarrox.xyz ⚠️';
                    document.body.appendChild(warning);
                    const style = document.createElement('style');
                    style.textContent = '@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }';
                    document.head.appendChild(style);
                }
                
                if (tiempoRestante <= 0) {
                    clearInterval(intervaloDemo);
                    mostrarBloqueo('DEMO FINALIZADA\nCompra la versión completa en\nwww.najarrox.xyz');
                }
            }, 1000);
            
            window.__NX_DEMO_INTERVAL__ = intervaloDemo;
        } else {
            async function validarSuscripcion() {
                if (__NX_BLOQUEO_ACTIVO__) return;
                try {
                    const response = await fetch(`/verificar-suscripcion?token=${__NX_TOKEN__}`);
                    const data = await response.json();
                    
                    if (data.activa) {
                        console.log('✅ Suscripción NX PRO activa');
                        if (!document.getElementById('nx-pro-badge')) {
                            const proBadge = document.createElement('div');
                            proBadge.id = 'nx-pro-badge';
                            proBadge.style.cssText = 'position:fixed;bottom:20px;left:20px;background:#00c853;color:black;font-family:monospace;padding:6px 12px;z-index:9999;font-size:11px;font-weight:bold;border-radius:20px;pointer-events:none;';
                            proBadge.innerHTML = '⭐ NX PRO ACTIVO';
                            document.body.appendChild(proBadge);
                        }
                        setTimeout(validarSuscripcion, 300000);
                    } else {
                        mostrarBloqueo('TU SUSCRIPCIÓN HA EXPIRADO\nRenueva en najarrox.xyz para seguir usando NX PRO');
                    }
                } catch (error) {
                    console.error('Error validando suscripción:', error);
                    setTimeout(validarSuscripcion, 30000);
                }
            }
            validarSuscripcion();
        }
        
        // ============================================
        // CÓDIGO PRINCIPAL DEL VISUALIZADOR ASCII
        // ============================================
        const canvasElement = document.getElementById('ascii-canvas');
        const ctx = canvasElement.getContext('2d');
        
        const renderScene = new THREE.Scene();
        renderScene.background = new THREE.Color(0x000000);
        const camera3D = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera3D.position.set(0, 0, 5.5);
        camera3D.lookAt(0, 0, 0);
        const webglRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        webglRenderer.setSize(200, 150);
        
        const POINTS_COUNT = 22000;
        const positions = new Float32Array(POINTS_COUNT * 3);
        const originalPositions = [];
        
        for (let i = 0; i < POINTS_COUNT; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 2.2 + (Math.random() - 0.5) * 0.3;
            let x = radius * Math.sin(phi) * Math.cos(theta);
            let y = radius * Math.sin(phi) * Math.sin(theta) * 0.9;
            let z = radius * Math.cos(phi);
            x += (Math.random() - 0.5) * 0.1;
            y += (Math.random() - 0.5) * 0.1;
            z += (Math.random() - 0.5) * 0.1;
            positions[i*3] = x;
            positions[i*3+1] = y;
            positions[i*3+2] = z;
            originalPositions.push(new THREE.Vector3(x, y, z));
        }
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const pointsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.045 });
        const pointsSystem = new THREE.Points(geometry, pointsMaterial);
        renderScene.add(pointsSystem);
        
        let webcamActive = false;
        let webcamStream = null;
        let webcamVideo = null;
        let webcamMix = 0.5;
        let webcamWidth = 160, webcamHeight = 120;
        
        async function toggleWebcam() {
            if (webcamActive) {
                if (webcamStream) webcamStream.getTracks().forEach(track => track.stop());
                webcamActive = false;
                webcamVideo = null;
                document.getElementById('webcamStatus').innerHTML = 'OFF';
                document.getElementById('webcamBtn').innerHTML = '📷 WEBCAM ON';
                showToast('WEBCAM OFF');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcamStream = stream;
                webcamVideo = document.createElement('video');
                webcamVideo.srcObject = stream;
                webcamVideo.play();
                webcamVideo.onloadedmetadata = () => {
                    webcamWidth = webcamVideo.videoWidth;
                    webcamHeight = webcamVideo.videoHeight;
                    webcamActive = true;
                    document.getElementById('webcamStatus').innerHTML = 'ON';
                    document.getElementById('webcamBtn').innerHTML = '📷 WEBCAM OFF';
                    showToast('WEBCAM ACTIVADA');
                };
            } catch(e) { showToast('WEBCAM ERROR'); }
        }
        
        document.getElementById('webcamBtn').onclick = toggleWebcam;
        document.getElementById('webcamMix').addEventListener('input', (e) => { webcamMix = parseFloat(e.target.value); });
        
        const charSets = {
            matrix: "01アイウエオカキクケコサシスセソタチツテト",
            dense: "█▓▒░@#$%&?*+;:,. ",
            binary: "10",
            full: "█▓▒░@#$%&?*+;:,.01アイウエオカキクケコ"
        };
        let currentCharset = charSets.full;
        
        let flameIntensity = 1.0, noiseDeform = 0.6, deformSpeed = 1.0, rotX = 0.3, rotY = 0.5, zoom = 5.5;
        let charDensity = 1.0, masterHue = 180, masterSat = 1.4, masterLight = 1.0, colorMode = 'full';
        let warpIntensity = 0.5, rgbSplit = 0.015, scanIntensity = 0.5, timeAnim = 0;
        
        let audioActive = false, audioCtx = null, analyser = null, mediaStream = null;
        let audioBuffer = new Uint8Array(128), audioBand = 0, audioAmp = 1.3, smoothFactor = 0.75;
        let rawAudioVal = 0.3, smoothAudioVal = 0.3;
        
        function getRawAudioStrength() {
            if (!audioActive || !analyser) return 0.3;
            analyser.getByteFrequencyData(audioBuffer);
            let start = 0, end = 40;
            if (audioBand === 1) { start = 40; end = 85; }
            if (audioBand === 2) { start = 85; end = 128; }
            let sum = 0;
            for (let i = start; i < end; i++) sum += audioBuffer[i];
            const avg = sum / (end - start) / 255;
            return Math.min(1.4, avg * 1.7) * audioAmp;
        }
        
        function getSmoothAudioStrength() {
            rawAudioVal = getRawAudioStrength();
            smoothAudioVal = smoothAudioVal * smoothFactor + rawAudioVal * (1 - smoothFactor);
            return Math.min(1.4, smoothAudioVal);
        }
        
        async function toggleAudio() {
            if (audioActive) {
                if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                if (audioCtx) await audioCtx.close();
                audioActive = false;
                document.getElementById('audioStatus').innerHTML = 'OFF';
                document.getElementById('audioMicBtn').innerHTML = 'MIC';
                showToast('AUDIO OFF');
                smoothAudioVal = 0.3;
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                audioCtx.resume();
                mediaStream = stream;
                audioActive = true;
                document.getElementById('audioStatus').innerHTML = 'ON';
                document.getElementById('audioMicBtn').innerHTML = 'ON';
                showToast('AUDIO ACTIVADO');
            } catch(e) { showToast('MIC ERROR'); }
        }
        
        function updateDeformation() {
            if (__NX_BLOQUEO_ACTIVO__) return;
            const posAttr = geometry.attributes.position.array;
            const audioVal = audioActive ? getSmoothAudioStrength() : 0.3;
            const fireFactor = flameIntensity * (0.5 + audioVal * 1.1);
            const noiseFactor = noiseDeform * (0.5 + audioVal * 0.9);
            const speed = deformSpeed * (0.6 + audioVal * 0.6);
            
            for (let i = 0; i < POINTS_COUNT; i++) {
                const orig = originalPositions[i];
                const fireWaveY = Math.sin(orig.y * 2.8 + timeAnim * 3.5) * fireFactor * 0.35;
                const fireWaveRad = Math.sin(orig.x * 2.2 + orig.z * 2.2 + timeAnim * 4.0) * fireFactor * 0.25;
                const nx = Math.sin(orig.x * 1.2 + timeAnim * speed) * Math.cos(orig.z * 1.0 + timeAnim * 0.5);
                const ny = Math.sin(orig.y * 1.6 + timeAnim * speed * 1.2) * Math.cos(orig.x * 1.1 + timeAnim * 0.8);
                const nz = Math.sin(orig.z * 1.3 + timeAnim * speed * 0.8) * Math.cos(orig.y * 1.2 + timeAnim * 0.6);
                let newX = orig.x + nx * noiseFactor * 0.55 + fireWaveRad * 0.45;
                let newY = orig.y + ny * noiseFactor * 0.65 + fireWaveY * 0.7;
                let newZ = orig.z + nz * noiseFactor * 0.55 + fireWaveRad * 0.35;
                const breath = 1 + Math.sin(timeAnim * (2.5 + audioVal * 1.2)) * 0.035 * fireFactor;
                newX *= breath; newY *= breath; newZ *= breath;
                posAttr[i*3] = newX;
                posAttr[i*3+1] = newY;
                posAttr[i*3+2] = newZ;
            }
            geometry.attributes.position.needsUpdate = true;
        }
        
        function hslToRgb(h, s, l) {
            h = ((h % 360) + 360) % 360;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const hp = h / 60;
            const x = c * (1 - Math.abs((hp % 2) - 1));
            let r1, g1, b1;
            if (hp <= 1) { r1 = c; g1 = x; b1 = 0; }
            else if (hp <= 2) { r1 = x; g1 = c; b1 = 0; }
            else if (hp <= 3) { r1 = 0; g1 = c; b1 = x; }
            else if (hp <= 4) { r1 = 0; g1 = x; b1 = c; }
            else if (hp <= 5) { r1 = x; g1 = 0; b1 = c; }
            else { r1 = c; g1 = 0; b1 = x; }
            const m = l - c / 2;
            return { r: Math.min(1, r1 + m), g: Math.min(1, g1 + m), b: Math.min(1, b1 + m) };
        }
        
        let asciiCols = 100, asciiRows = 60;
        
        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvasElement.width = w;
            canvasElement.height = h;
            asciiCols = Math.floor(w / (10 / charDensity));
            asciiRows = Math.floor(h / (20 / charDensity));
            asciiCols = Math.min(160, Math.max(40, asciiCols));
            asciiRows = Math.min(100, Math.max(30, asciiRows));
            webglRenderer.setSize(asciiCols, asciiRows);
            camera3D.aspect = asciiCols / asciiRows;
            camera3D.updateProjectionMatrix();
        }
        
        function captureWebcamFrame() {
            if (!webcamActive || !webcamVideo || webcamVideo.readyState < 2) return null;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = asciiCols;
            tempCanvas.height = asciiRows;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(webcamVideo, 0, 0, asciiCols, asciiRows);
            return tempCtx.getImageData(0, 0, asciiCols, asciiRows);
        }
        
        function renderASCII() {
            if (__NX_BLOQUEO_ACTIVO__) return;
            if (asciiCols <= 0 || asciiRows <= 0) return;
            
            webglRenderer.render(renderScene, camera3D);
            const glCanvas = webglRenderer.domElement;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = asciiCols;
            tempCanvas.height = asciiRows;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(glCanvas, 0, 0, asciiCols, asciiRows);
            const imgData = tempCtx.getImageData(0, 0, asciiCols, asciiRows);
            const data = imgData.data;
            
            let webcamData = null;
            if (webcamActive) {
                const webcamFrame = captureWebcamFrame();
                if (webcamFrame) webcamData = webcamFrame.data;
            }
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            
            const charW = canvasElement.width / asciiCols;
            const charH = canvasElement.height / asciiRows;
            const chars = currentCharset;
            const audioVal = audioActive ? smoothAudioVal : 0.3;
            const warp = warpIntensity * (0.5 + audioVal * 0.8);
            const scan = scanIntensity * (0.5 + audioVal * 0.5);
            
            const fontSize = Math.max(10, Math.min(24, charH * 0.75));
            ctx.font = `${fontSize}px "Courier New", monospace`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            
            for (let y = 0; y < asciiRows; y++) {
                for (let x = 0; x < asciiCols; x++) {
                    const idx = (y * asciiCols + x) * 4;
                    let brightness_3d = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    let warpX = x + Math.sin(y * 0.12 + timeAnim * 3.5) * warp * 1.8;
                    let warpY = y + Math.cos(x * 0.12 + timeAnim * 3.0) * warp * 1.5;
                    warpX = Math.min(asciiCols - 1, Math.max(0, warpX));
                    warpY = Math.min(asciiRows - 1, Math.max(0, warpY));
                    const warpIdx = (Math.floor(warpY) * asciiCols + Math.floor(warpX)) * 4;
                    brightness_3d = (data[warpIdx] + data[warpIdx+1] + data[warpIdx+2]) / 3 || brightness_3d;
                    
                    let brightness_cam = brightness_3d;
                    if (webcamData) {
                        const camIdx = (y * asciiCols + x) * 4;
                        brightness_cam = (webcamData[camIdx] + webcamData[camIdx+1] + webcamData[camIdx+2]) / 3;
                    }
                    
                    let brightness;
                    if (webcamActive && webcamMix > 0) {
                        brightness = brightness_3d * (1 - webcamMix) + brightness_cam * webcamMix;
                    } else {
                        brightness = brightness_3d;
                    }
                    
                    const charIdx = Math.floor(brightness / 255 * (chars.length - 1) * charDensity);
                    const char = chars[Math.min(chars.length - 1, Math.max(0, charIdx))];
                    const px = x * charW + charW / 2;
                    const py = y * charH + charH / 2;
                    
                    if (colorMode === 'mono') {
                        const val = (brightness / 255) * masterLight;
                        const gray = Math.min(255, Math.floor(val * 255));
                        ctx.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
                    } else {
                        let hue = masterHue;
                        let sat = masterSat;
                        let light = masterLight * (0.4 + brightness / 255 * 0.8);
                        if (colorMode === 'colorama') {
                            hue = (masterHue + brightness * 1.5 + timeAnim * 25) % 360;
                            sat = masterSat;
                        }
                        const rgb = hslToRgb(hue, sat, light);
                        ctx.fillStyle = `rgb(${Math.floor(rgb.r * 255)}, ${Math.floor(rgb.g * 255)}, ${Math.floor(rgb.b * 255)})`;
                    }
                    ctx.fillText(char, px, py);
                }
            }
            
            if (scan > 0.05) {
                const imageData = ctx.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const pixels = imageData.data;
                for (let y = 0; y < canvasElement.height; y++) {
                    const scanVal = Math.sin(y * 0.15 + timeAnim * 25) * scan * 35;
                    for (let x = 0; x < canvasElement.width; x++) {
                        const idx = (y * canvasElement.width + x) * 4;
                        pixels[idx] = Math.min(255, pixels[idx] + scanVal);
                        pixels[idx+1] = Math.min(255, pixels[idx+1] + scanVal * 0.6);
                        pixels[idx+2] = Math.min(255, pixels[idx+2] + scanVal * 1.1);
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }
            
            if (rgbSplit > 0.01) {
                const imageData = ctx.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const pixels = imageData.data;
                const offset = Math.floor(canvasElement.width * rgbSplit * 16 * (0.5 + Math.sin(timeAnim * 30) * 0.4));
                const copy = new Uint8ClampedArray(pixels);
                for (let y = 0; y < canvasElement.height; y++) {
                    for (let x = 0; x < canvasElement.width; x++) {
                        const idx = (y * canvasElement.width + x) * 4;
                        const rIdx = (y * canvasElement.width + Math.min(canvasElement.width - 1, x + offset)) * 4;
                        const bIdx = (y * canvasElement.width + Math.max(0, x - offset)) * 4;
                        if (rIdx < pixels.length && bIdx < pixels.length) {
                            pixels[idx] = copy[rIdx];
                            pixels[idx+2] = copy[bIdx+2];
                        }
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }
        }
        
        document.getElementById('flameIntensity').addEventListener('input', (e) => { flameIntensity = parseFloat(e.target.value); });
        document.getElementById('noiseDeform').addEventListener('input', (e) => { noiseDeform = parseFloat(e.target.value); });
        document.getElementById('deformSpeed').addEventListener('input', (e) => { deformSpeed = parseFloat(e.target.value); });
        document.getElementById('rotX').addEventListener('input', (e) => { rotX = parseFloat(e.target.value); });
        document.getElementById('rotY').addEventListener('input', (e) => { rotY = parseFloat(e.target.value); });
        document.getElementById('zoom').addEventListener('input', (e) => { zoom = parseFloat(e.target.value); camera3D.position.z = zoom; });
        document.getElementById('charDensity').addEventListener('input', (e) => { charDensity = parseFloat(e.target.value); resizeCanvas(); });
        document.getElementById('charSetSelect').addEventListener('change', (e) => { currentCharset = charSets[e.target.value]; showToast(`CHARSET: ${e.target.value}`); });
        document.getElementById('masterHue').addEventListener('input', (e) => { masterHue = parseFloat(e.target.value); });
        document.getElementById('masterSat').addEventListener('input', (e) => { masterSat = parseFloat(e.target.value); });
        document.getElementById('masterLight').addEventListener('input', (e) => { masterLight = parseFloat(e.target.value); });
        document.getElementById('warpIntensity').addEventListener('input', (e) => { warpIntensity = parseFloat(e.target.value); });
        document.getElementById('rgbSplit').addEventListener('input', (e) => { rgbSplit = parseFloat(e.target.value); });
        document.getElementById('scanLines').addEventListener('input', (e) => { scanIntensity = parseFloat(e.target.value); });
        document.getElementById('smoothFactor').addEventListener('input', (e) => { smoothFactor = parseFloat(e.target.value); });
        document.getElementById('monoBtn').onclick = () => { colorMode = 'mono'; showToast('MONOCHROME'); };
        document.getElementById('coloramaBtn').onclick = () => { colorMode = 'colorama'; showToast('COLORAMA'); };
        document.getElementById('glitchBurstBtn').onclick = () => { rgbSplit = 0.065; warpIntensity = 1.1; setTimeout(() => { rgbSplit = parseFloat(document.getElementById('rgbSplit').value); warpIntensity = parseFloat(document.getElementById('warpIntensity').value); }, 400); showToast('GLITCH BURST'); };
        document.getElementById('audioMicBtn').onclick = toggleAudio;
        document.getElementById('audioBand').onchange = (e) => { audioBand = parseInt(e.target.value); showToast(`BAND: ${e.target.options[e.target.selectedIndex].text}`); };
        document.getElementById('audioAmp').oninput = (e) => { audioAmp = parseFloat(e.target.value); };
        
        let mediaRec = null, recChunks = [];
        document.getElementById('pngBtn').onclick = () => { const a = document.createElement('a'); a.href = canvasElement.toDataURL(); a.download = `nx_ascii_${Date.now()}.png`; a.click(); showToast('PNG'); };
        document.getElementById('recordBtn').onclick = () => { const stream = canvasElement.captureStream(30); mediaRec = new MediaRecorder(stream, { mimeType: 'video/webm' }); recChunks = []; mediaRec.ondataavailable = (e) => { if(e.data.size) recChunks.push(e.data); }; mediaRec.onstop = () => { const blob = new Blob(recChunks, {type:'video/webm'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `nx_ascii_${Date.now()}.webm`; a.click(); showToast('VIDEO'); }; mediaRec.start(); showToast('REC'); };
        document.getElementById('stopBtn').onclick = () => { if(mediaRec && mediaRec.state === 'recording') mediaRec.stop(); };
        document.getElementById('hideUiBtn').onclick = () => document.body.classList.toggle('ui-hidden');
        document.getElementById('resetBtn').onclick = () => { location.reload(); };
        document.getElementById('hotspotTrigger').addEventListener('click', () => { document.body.classList.toggle('ui-hidden'); showToast('UI TOGGLED'); });
        
        function showToast(msg) { const div = document.createElement('div'); div.className = 'toast-msg'; div.innerText = msg; document.body.appendChild(div); setTimeout(() => div.remove(), 800); }
        
        function animate() {
            if (__NX_BLOQUEO_ACTIVO__) return;
            timeAnim += 0.016;
            updateDeformation();
            const audioVal = audioActive ? smoothAudioVal : 0.3;
            camera3D.position.x += ((Math.sin(timeAnim * 0.35) * rotX * 1.0) - camera3D.position.x) * 0.04;
            camera3D.position.y += ((Math.cos(timeAnim * 0.55) * rotY * 0.9) - camera3D.position.y) * 0.04;
            camera3D.lookAt(0, 0, 0);
            renderASCII();
            __NX_ANIMATION_ID__ = requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', () => resizeCanvas());
        resizeCanvas();
        camera3D.position.z = zoom;
        showToast('🔥 NX ASCII MATRIX // TOUCH RIGHT EDGE 🔥');
        __NX_ANIMATION_ID__ = requestAnimationFrame(animate);
        
        window.addEventListener('beforeunload', () => {
            if (window.__NX_DEMO_INTERVAL__) clearInterval(window.__NX_DEMO_INTERVAL__);
            if (__NX_ANIMATION_ID__) cancelAnimationFrame(__NX_ANIMATION_ID__);
        });
    </script>
</body>
</html>
